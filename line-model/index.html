<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>広告モデル登録フォーム｜株式会社solezore</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="container">
    <h1>広告モデル登録</h1>
    <p class="lead">
      企業の広告素材に出演していただく方の登録シートです。<br>
      入力後、一番下のボタンからLINEを送信してください。
    </p>

    <div class="notice">
      <strong>ご自身のアカウントでの投稿はありません。</strong><br>
      広告モデルは、企業の広告に使う写真・動画に出演し、素材をお渡しいただくお仕事です。撮影した素材は企業側の広告として使われます。<br>
      ご自身のアカウントで投稿するお仕事をお探しの場合は、メニューの<strong>インフルエンサー登録</strong>からお願いします。
    </div>

    <div class="section">
      <h2>基本情報</h2>
      <div class="form-group">
        <label for="userName">活動名・お名前</label>
        <input type="text" id="userName" placeholder="例：山田 花子">
      </div>

      <div class="form-group">
        <label for="userGender">性別</label>
        <select id="userGender">
          <option value="">選択してください</option>
          <option value="女性">女性</option>
          <option value="男性">男性</option>
          <option value="回答しない">回答しない</option>
        </select>
      </div>

      <div class="form-group">
        <label for="userAge">年齢</label>
        <input type="number" id="userAge" placeholder="例：28">
      </div>

      <div class="form-group">
        <label for="userArea">居住地・撮影に行けるエリア</label>
        <input type="text" id="userArea" placeholder="例：東京都／首都圏なら可">
      </div>
    </div>

    <div class="section">
      <h2>出演できる条件</h2>
      <div class="form-group">
        <label for="faceOk">顔出し</label>
        <select id="faceOk">
          <option value="">選択してください</option>
          <option value="顔出しOK">顔出しOK</option>
          <option value="顔出しなし（手元・後ろ姿などのみ）">顔出しなし（手元・後ろ姿などのみ）</option>
        </select>
      </div>

      <div class="form-group">
        <label>対応できる撮影（複数選択可）</label>
        <div class="questions-grid" id="shootTypes">
          <label class="question-item"><input type="checkbox"><span>写真（スチール）</span></label>
          <label class="question-item"><input type="checkbox"><span>動画</span></label>
          <label class="question-item"><input type="checkbox"><span>音声・ナレーション</span></label>
          <label class="question-item"><input type="checkbox"><span>ライブ配信</span></label>
        </div>
      </div>

      <div class="form-group">
        <label>撮影できる場所（複数選択可）</label>
        <div class="questions-grid" id="shootPlaces">
          <label class="question-item"><input type="checkbox"><span>自宅で撮影できる</span></label>
          <label class="question-item"><input type="checkbox"><span>スタジオ・現地に行ける</span></label>
          <label class="question-item"><input type="checkbox"><span>屋外ロケOK</span></label>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>経験</h2>
      <div class="form-group">
        <label for="userExperience">出演経験</label>
        <select id="userExperience">
          <option value="">選択してください</option>
          <option value="広告・PR出演の経験あり">広告・PR出演の経験あり</option>
          <option value="モデル・タレント経験あり">モデル・タレント経験あり</option>
          <option value="未経験">未経験</option>
        </select>
      </div>

      <div class="form-group">
        <label for="refUrl">参考URL <span class="opt">（SNS・過去の出演実績など・任意）</span></label>
        <input type="text" id="refUrl" placeholder="https://instagram.com/...">
      </div>
    </div>

    <div class="section">
      <div class="form-group">
        <label for="userNote">自己PR・備考 <span class="opt">（任意）</span></label>
        <textarea id="userNote" rows="3" placeholder="得意な雰囲気、稼働できる曜日・時間帯などあればご記入ください"></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="sendToLineButton">登録内容をLINEで送る</button>
      <p class="hint">ボタンを押すとLINEが開きます。内容を確認して送信してください。</p>
    </div>

  </div>
  <script src="./script.js"></script>
</body>
</html>
